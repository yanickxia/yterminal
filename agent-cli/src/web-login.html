<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to yterminal</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #171824; color: #e0e6f7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      form { width: min(20rem, 85vw); display: grid; gap: 1rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.65rem; }
      input, button { font: inherit; padding: .65rem .75rem; border-radius: .4rem; }
      input { border: 1px solid #555e80; background: #212338; color: inherit; }
      button { border: 0; background: #a4b7ff; color: #15182b; cursor: pointer; }
      p { margin: 0; color: #ff9f9f; }
      p:empty { display: none; }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>yterminal</h1>
      <label for="token">Access token</label>
      <input id="token" type="password" name="token" required autofocus>
      <p role="alert">{{error}}</p>
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
